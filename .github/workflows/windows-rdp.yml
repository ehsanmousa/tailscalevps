name: Windows V2Ray Server

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 2880

    steps:
      - name: Enable Remote Desktop
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
          Write-Host "Remote Desktop enabled" -ForegroundColor Green

      - name: Create Admin Account
        shell: pwsh
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force
          New-LocalUser -Name "NvDAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NvDAdmin" -ErrorAction SilentlyContinue
          net user runneradmin P@ssw0rd1qazXSW@#
          Write-Host "Admin account created" -ForegroundColor Green

      - name: Install Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Write-Host "Downloading Tailscale..." -ForegroundColor Yellow
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Write-Host "Installing Tailscale..." -ForegroundColor Yellow
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 10
          Write-Host "Connecting to Tailscale..." -ForegroundColor Yellow
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-v2ray-server"
          Start-Sleep -Seconds 10
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          echo "TAILSCALE_IP=$ts_ip" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> TAILSCALE CONNECTED! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green

      - name: Setup V2Ray Server
        shell: pwsh
        run: |
          Write-Host "Creating V2Ray directory..." -ForegroundColor Yellow
          New-Item -ItemType Directory -Force -Path "C:\v2ray" | Out-Null
          Set-Location "C:\v2ray"
          Write-Host "Downloading V2Ray core..." -ForegroundColor Yellow
          $v2rayUrl = "https://github.com/v2fly/v2ray-core/releases/latest/download/v2ray-windows-64.zip"
          Invoke-WebRequest -Uri $v2rayUrl -OutFile "v2ray.zip" -UseBasicParsing
          Expand-Archive -Path "v2ray.zip" -DestinationPath "C:\v2ray" -Force
          Remove-Item "v2ray.zip" -Force
          Write-Host "Generating UUID..." -ForegroundColor Yellow
          $uuid = C:\v2ray\v2ray.exe uuid
          $uuid = $uuid.Trim()
          Write-Host "Creating server configuration (VLESS)..." -ForegroundColor Yellow
          $config = '{
            "log": {
              "loglevel": "info"
            },
            "inbounds": [{
              "port": 10086,
              "protocol": "vless",
              "settings": {
                "clients": [{
                  "id": "' + $uuid + '",
                  "flow": "xtls-rprx-vision"
                }],
                "decryption": "none"
              },
              "streamSettings": {
                "network": "tcp",
                "security": "none"
              }
            }],
            "outbounds": [{
              "protocol": "freedom",
              "settings": {}
            }]
          }'
          [System.IO.File]::WriteAllText("C:\v2ray\config.json", $config, (New-Object System.Text.UTF8Encoding $false))
          Write-Host "Configuring Windows Firewall..." -ForegroundColor Yellow
          New-NetFirewallRule -DisplayName "V2Ray Inbound" -Direction Inbound -Protocol TCP -LocalPort 10086 -Action Allow -ErrorAction SilentlyContinue | Out-Null
          New-NetFirewallRule -DisplayName "V2Ray Tailscale" -Direction Inbound -Protocol TCP -LocalPort 10086 -RemoteAddress "100.64.0.0/10" -Action Allow -ErrorAction SilentlyContinue | Out-Null
          Write-Host "Creating auto-restart wrapper..." -ForegroundColor Yellow
          $wrapper = 'while ($true) {
              Write-Host "$(Get-Date) - Starting V2Ray..."
              try {
                  Set-Location "C:\v2ray"
                  $p = Start-Process -FilePath "C:\v2ray\v2ray.exe" -ArgumentList "run -config C:\v2ray\config.json" -NoNewWindow -PassThru
                  $p.WaitForExit()
                  Write-Host "$(Get-Date) - V2Ray exited with code: $($p.ExitCode)"
              } catch {
                  Write-Host "$(Get-Date) - Error: $_"
              }
              Write-Host "$(Get-Date) - Restarting in 5 seconds..."
              Start-Sleep -Seconds 5
          }'
          [System.IO.File]::WriteAllText("C:\v2ray\run.ps1", $wrapper, (New-Object System.Text.UTF8Encoding $false))
          Write-Host "Creating scheduled task..." -ForegroundColor Yellow
          Unregister-ScheduledTask -TaskName "V2RayWrapper" -Confirm:$false -ErrorAction SilentlyContinue
          $action = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File C:\v2ray\run.ps1"
          $trigger = New-ScheduledTaskTrigger -AtStartup
          $principal = New-ScheduledTaskPrincipal -UserId "SYSTEM" -LogonType ServiceAccount -RunLevel Highest
          $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable -MultipleInstances IgnoreNew
          Register-ScheduledTask -TaskName "V2RayWrapper" -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Description "V2Ray Auto-Restart Wrapper" -Force | Out-Null
          Write-Host "Starting V2Ray..." -ForegroundColor Yellow
          Start-ScheduledTask -TaskName "V2RayWrapper"
          Start-Sleep -Seconds 8
          $v2rayProcess = Get-Process v2ray -ErrorAction SilentlyContinue
          if ($v2rayProcess) {
              Write-Host "V2Ray started! (PID: $($v2rayProcess.Id))" -ForegroundColor Green
          } else {
              Write-Host "V2Ray may not have started" -ForegroundColor Yellow
          }
          echo "UUID=$uuid" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Generate VLESS Link
        shell: pwsh
        run: |
          $tailscaleIP = "${{ env.TAILSCALE_IP }}"
          $uuid = "${{ env.UUID }}"
          if (-not $tailscaleIP) {
              $tailscaleIP = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.InterfaceAlias -like "*Tailscale*" }).IPAddress
          }
          $vlessLink = "vless://$uuid@$tailscaleIP`:10086?flow=xtls-rprx-vision&encryption=none&security=none&type=tcp#GitHub-V2Ray-Server"
          $vlessLinkAlt = "vless://$uuid@$tailscaleIP`:10086?flow=xtls-rprx-vision&encryption=none&type=tcp#GitHub-V2Ray-Server"
          echo "VLESS_LINK=$vlessLink" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VLESS_LINK_ALT=$vlessLinkAlt" | Out-File -FilePath $env:GITHUB_ENV -Append
          $vlessLink | Out-File -FilePath "C:\v2ray\vless-link.txt" -Encoding ascii
          $vlessLinkAlt | Out-File -FilePath "C:\v2ray\vless-link-alt.txt" -Encoding ascii
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  V2RAY (VLESS) SERVER IS READY!" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "  VLESS LINK (Try this first):" -ForegroundColor Yellow
          Write-Host "  $vlessLink" -ForegroundColor White
          Write-Host ""
          Write-Host "  VLESS LINK (Alternative):" -ForegroundColor Yellow
          Write-Host "  $vlessLinkAlt" -ForegroundColor White
          Write-Host ""
          Write-Host "  MANUAL CONFIGURATION:" -ForegroundColor Yellow
          Write-Host "  Address: $tailscaleIP" -ForegroundColor Cyan
          Write-Host "  Port: 10086" -ForegroundColor Cyan
          Write-Host "  UUID: $uuid" -ForegroundColor Cyan
          Write-Host "  Protocol: VLESS" -ForegroundColor Cyan
          Write-Host "  Flow: xtls-rprx-vision" -ForegroundColor Cyan
          Write-Host "  Encryption: none" -ForegroundColor Cyan
          Write-Host "  Network: tcp" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "  RDP ACCESS:" -ForegroundColor Yellow
          Write-Host "  IP: $tailscaleIP" -ForegroundColor Cyan
          Write-Host "  Username: NvdAdmin" -ForegroundColor Cyan
          Write-Host "  Password: P@ssw0rd1qazXSW@#" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green

      - name: Upload V2Ray Configuration
        uses: actions/upload-artifact@v4
        with:
          name: v2ray-config
          path: |
            C:\v2ray\config.json
            C:\v2ray\vless-link.txt
            C:\v2ray\vless-link-alt.txt
          retention-days: 7

      - name: Final Summary
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "  V2RAY (VLESS) SERVER FULLY OPERATIONAL!" -ForegroundColor Green
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "  VLESS LINK (Copy this into your client):" -ForegroundColor Green
          Write-Host "  ${{ env.VLESS_LINK }}" -ForegroundColor White
          Write-Host ""
          Write-Host "  Alternative VLESS LINK:" -ForegroundColor Green
          Write-Host "  ${{ env.VLESS_LINK_ALT }}" -ForegroundColor White
          Write-Host ""
          Write-Host "  MANUAL CONFIGURATION:" -ForegroundColor Yellow
          Write-Host "  Server IP: ${{ env.TAILSCALE_IP }}" -ForegroundColor Cyan
          Write-Host "  UUID: ${{ env.UUID }}" -ForegroundColor Cyan
          Write-Host "  Port: 10086" -ForegroundColor Cyan
          Write-Host "  Protocol: VLESS" -ForegroundColor Cyan
          Write-Host "  Flow: xtls-rprx-vision" -ForegroundColor Cyan
          Write-Host "  Encryption: none" -ForegroundColor Cyan
          Write-Host "  Network: tcp" -ForegroundColor Cyan
          Write-Host "  Security: none" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "  RDP Access:" -ForegroundColor Yellow
          Write-Host "     Username: NvdAdmin" -ForegroundColor Cyan
          Write-Host "     Password: P@ssw0rd1qazXSW@#" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "  Server will run for 48 hours" -ForegroundColor Yellow
          Write-Host "  Config files in artifacts" -ForegroundColor Yellow
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan

      - name: Keep Server Alive
        shell: pwsh
        run: |
          Write-Host "Keeping server alive for 48 hours..." -ForegroundColor Yellow
          Write-Host "   Press Ctrl+C to stop early" -ForegroundColor Gray
          Write-Host ""
          for ($i = 1; $i -le 2880; $i++) {
            Start-Sleep -Seconds 60
            if ($i % 60 -eq 0) {
              $hours = [math]::Floor($i / 60)
              $timestamp = Get-Date -Format "HH:mm:ss"
              Write-Host "[$hours/48h] Server running - $timestamp" -ForegroundColor Cyan
              $proc = Get-Process v2ray -ErrorAction SilentlyContinue
              if ($proc) {
                  Write-Host "  V2Ray is running (PID: $($proc.Id))" -ForegroundColor Green
              } else {
                  Write-Host "  V2Ray is not running" -ForegroundColor Yellow
              }
            }
          }
          Write-Host "Server time expired. Shutting down..." -ForegroundColor Yellow
