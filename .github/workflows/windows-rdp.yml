name: Windows Cloud RDP with V2Ray

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 0. Checkout Repository
        uses: actions/checkout@v4

      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force
          New-LocalUser -Name "NvDAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NvDAdmin" -ErrorAction SilentlyContinue
          net user runneradmin P@ssw0rd1qazXSW@#

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-v2ray-server"
          Start-Sleep -Seconds 8
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : NvdAdmin" -ForegroundColor Yellow
          Write-Host "  Password     : P@ssw0rd1qazXSW@#" -ForegroundColor Yellow
          Write-Host "  >> Open mstsc and connect to: $ts_ip" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green

      - name: 4. Install V2Ray Server
        run: |
          if (Test-Path ".\v2ray-server-setup.ps1") {
            Write-Host "Found v2ray-server-setup.ps1 in repository" -ForegroundColor Green
            Set-ExecutionPolicy Bypass -Scope Process -Force
            .\v2ray-server-setup.ps1
          } else {
            Write-Host "v2ray-server-setup.ps1 not found in repository!" -ForegroundColor Red
            exit 1
          }

      - name: 5. Display V2Ray Connection Info
        run: |
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> V2RAY SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green

          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          $config = Get-Content "C:\v2ray\config.json" -Raw | ConvertFrom-Json
          $uuid = $config.inbounds[0].settings.clients[0].id

          $vmessString = @"
{
  "v": "2",
  "ps": "GitHub-V2Ray-Server",
  "add": "$ts_ip",
  "port": "10086",
  "id": "$uuid",
  "aid": "0",
  "net": "tcp",
  "type": "none",
  "host": "",
  "path": "",
  "tls": "none"
}
"@

          $base64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($vmessString))
          $vmessLink = "vmess://$base64"

          @"
V2RAY SERVER CONNECTION INFO
============================
Tailscale IP: $ts_ip
Port: 10086
UUID: $uuid
Protocol: VMess (TCP)
Alter ID: 0

VMESS LINK:
$vmessLink

RDP ACCESS:
IP: $ts_ip
Username: NvdAdmin
Password: P@ssw0rd1qazXSW@#
"@ | Out-File -FilePath "C:\v2ray-connection-info.txt" -Encoding ascii

          Write-Host ""
          Write-Host "📋 V2RAY SERVER INFO:" -ForegroundColor Yellow
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Cyan
          Write-Host "  Port         : 10086" -ForegroundColor Cyan
          Write-Host "  UUID         : $uuid" -ForegroundColor Cyan
          Write-Host "  Protocol     : VMess (TCP)" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "🔗 VMESS LINK:" -ForegroundColor Yellow
          Write-Host "  $vmessLink" -ForegroundColor Green
          Write-Host ""
          Write-Host "📝 RDP ACCESS:" -ForegroundColor Yellow
          Write-Host "  IP           : $ts_ip" -ForegroundColor Cyan
          Write-Host "  Username     : NvdAdmin" -ForegroundColor Cyan
          Write-Host "  Password     : P@ssw0rd1qazXSW@#" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green

      - name: 6. Upload Connection Info Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2ray-connection-info
          path: C:\v2ray-connection-info.txt
        if: always()

      - name: 7. Upload V2Ray Config Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2ray-config
          path: C:\v2ray\config.json
        if: always()

      - name: 8. Keep Server Alive (48 Hours)
        run: |
          Write-Host ""
          Write-Host "Server will run for 48 hours." -ForegroundColor Yellow
          Write-Host "RDP and V2Ray will remain available during this time." -ForegroundColor Cyan
          Write-Host ""

          for ($i = 1; $i -le 2880; $i++) {
            Start-Sleep -Seconds 60
            if ($i % 30 -eq 0) {
              $hours = [math]::Round($i / 60, 1)
              Write-Host "[$i/2880] Server running for $hours hours..." -ForegroundColor Green
            }
          }
